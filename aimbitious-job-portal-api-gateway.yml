server:
  port: ${PORT:5000}

spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            # User Service routes -
            - id: user-service
              uri: lb://aimbitious-job-portal-user-service
              predicates:
                - Path=/auth/**,/api/users/**

            # Job Service routes -
            - id: job-service
              uri: lb://aimbitious-job-portal-job-service
              predicates:
                  - Path=/api/jobs/**,/api/job-categories/**,/api/job-skills/**,/api/job-tags/**

            # Application Service route -
            - id: application-service
              uri: lb://aimbitious-job-portal-application-service
              predicates:
                - Path=/api/applications/**

            # Company Service route -
            - id: company-service
              uri: lb://aimbitious-job-portal-company-service
              predicates:
                - Path=/api/companies/**

            # Resume Service route -
            - id: resume-service
              uri: lb://aimbitious-job-portal-resume-service
              predicates:
                - Path=/api/resumes/**

            # Preference Service route -
            - id: preference-service
              uri: lb://aimbitious-job-portal-preference-service
              predicates:
                - Path=/api/preferences/**

            # AI Service - Main AI endpoints -
            - id: ai-service
              uri: lb://aimbitious-job-portal-ai-service
              predicates:
                - Path=/api/ai/**

            # AI Service - Search enhancement and job alert suggestions -
            - id: ai-search-service
              uri: lb://aimbitious-job-portal-ai-service
              predicates:
                - Path=/enhance,/alert-suggestion

            # Notification Service route -
            - id: notification-service
              uri: lb://aimbitious-job-portal-notification-service
              predicates:
                - Path=/api/notifications/**

          discovery:
            locator:
              enabled: true
              lower-case-service-id: true

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: https://aimbitious-service-registry.onrender.com/eureka/
  instance:
    prefer-ip-address: true