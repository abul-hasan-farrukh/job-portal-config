server:
  port: ${PORT:5000}

spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
#            User Service routes -
            - id: user-service
              uri: lb://aimbitious-job-portal-user-service
              predicates:
                - Path=/auth/**,/api/users/**

            # Job Service routes -
            - id: job-service
              uri: lb://aimbitious-job-portal-job-service
              predicates:
                  - Path=/api/jobs/**,/api/job-categories/**,/api/job-skills/**,/api/job-tags/**


          discovery:
            locator:
              enabled: true
              lower-case-service-id: true

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: https://aimbitious-service-registry.onrender.com/eureka/
  instance:
    prefer-ip-address: true